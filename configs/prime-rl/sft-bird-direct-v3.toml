# Direct BIRD CoT warm start for RLVR. Starts from the unmodified Qwen3-4B
# base; the wide-domain checkpoint is intentionally not part of this run.
output_dir = "/home/ubuntu/bird-text2sql-rl/outputs/prime-rl"
max_steps = 60
clean = false

[deployment]
num_train_gpus = 1
num_infer_gpus = 1

# Preserve every online-eval candidate until selection. Prime-RL trainer
# checkpoints are large, so remove non-selected steps only after the run.
[ckpt]
interval = 10

[model]
name = "/data/qwen3-4b-instruct-2507"
seq_len = 32768

[model.lora]
rank = 32
alpha = 64.0
dropout = 0.0
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

[renderer]
name = "qwen3"
enable_thinking = false

[data]
name = "/data/ximo/bird-text2sql-rl/data/sft-v2-bird"
splits = ["train"]
seq_len = 32768
batch_size = 8
micro_batch_size = 1
num_workers = 2
shuffle = true
seed = 23

[data.loss_mask]
system = false
user = false
assistant = true
tool = false

# Teacher-forced loss is a diagnostic only. Checkpoint selection is driven by
# the online execution evaluation below.
[val]
interval = 10
eval_on_start = true

[val.data]
name = "/data/ximo/bird-text2sql-rl/data/sft-v2-bird"
splits = ["validation"]
seq_len = 32768
batch_size = 8
micro_batch_size = 1
num_workers = 1
shuffle = false

[optim]
type = "adamw"
lr = 1e-5
weight_decay = 0.0
max_norm = 1.0

# Four warm-up steps avoid an abrupt first update. Cosine decay makes the
# bounded 60-step run safer than a constant LR if the best point is late.
[scheduler]
type = "cosine"
warmup_steps = 4
min_lr = 1e-6

[weight_broadcast]
type = "filesystem"

[monitors.file]

# The same ReViSQL verified validation split is evaluated at step 0 and every
# candidate checkpoint. Two of its 398 SFT rows are excluded here by the
# deterministic execution policy, leaving 396 executable grading tasks.
[eval]
interval = 10
num_examples = -1
group_size = 1

[eval.sampling]
temperature = 0.0
max_completion_tokens = 2048

[eval.concurrency]
max_inflight = 32

[[eval.source]]
name = "bird-platinum-validation"
interval = 10
num_examples = -1
env.taskset.id = "bird-text2sql"
env.taskset.path = "/data/ximo/bird-text2sql-rl/data/rlvr-v2/validation.jsonl"
env.taskset.database_root = "/data/ximo/sql-training/train_databases"
env.taskset.sample_rows = 3
env.taskset.task.shape_reward = false
env.taskset.task.use_verieql = false
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"
serve.pool.type = "static"
serve.pool.num_workers = 2

[inference]

[inference.vllm]
gpu_memory_utilization = 0.9
max_model_len = 36864
enable_prefix_caching = true
