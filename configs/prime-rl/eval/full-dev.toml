output_dir = "/home/ubuntu/bird-text2sql-rl/outputs/prime-rl"
model = "bird-text2sql-base"
num_tasks = 1534
num_rollouts = 1
max_concurrent = 32
shuffle = false
push = false

[client]
type = "eval"
base_url = "http://127.0.0.1:8000/v1"
api_key_var = "LOCAL_API_KEY"

[sampling]
temperature = 0.0
max_tokens = 1024

[env.taskset]
id = "bird-text2sql"
path = "/data/ximo/bird-dev/dev_20251106.json"
database_root = "/data/ximo/minidev/MINIDEV/dev_databases"
limit = 1534
sample_rows = 3

[env.taskset.task]
timeout_seconds = 5.0
gold_timeout_seconds = 30.0
float_digits = 10

[env.agent]
max_turns = 1
max_output_tokens = 1024
max_total_tokens = 36864

[env.agent.harness]
id = "null"

[env.agent.runtime]
type = "subprocess"

[serve.pool]
type = "static"
num_workers = 2
