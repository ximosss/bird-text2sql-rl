# One-time Base rollout over the ReViSQL verified train-side executable tasks.
# The traces are used only to build leakage-safe corrective SFT targets.
output_dir = "/home/ubuntu/bird-text2sql-rl/outputs/prime-rl"
model = "bird-text2sql-base"
num_rollouts = 1
max_concurrent = 32
shuffle = false
push = false

[client]
type = "eval"
# `localhost` is intentional: Verifiers' subprocess interception recognizes
# this local endpoint, while the numeric loopback address is sandbox-local.
base_url = "http://localhost:8000/v1"
api_key_var = "LOCAL_API_KEY"

[sampling]
temperature = 0.0
max_tokens = 2048

[env.taskset]
id = "bird-text2sql"
path = "/data/ximo/bird-text2sql-rl/data/rlvr-v2/train.jsonl"
database_root = "/data/ximo/sql-training/train_databases"
sample_rows = 3

[env.taskset.task]
timeout_seconds = 8.0
gold_timeout_seconds = 60.0
float_digits = 10
shape_reward = false
use_verieql = false

[env.agent]
max_turns = 1
max_output_tokens = 2048
max_total_tokens = 36864

[env.agent.harness]
id = "null"

[env.agent.runtime]
type = "subprocess"

[serve.pool]
type = "static"
num_workers = 2
