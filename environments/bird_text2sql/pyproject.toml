[project]
name = "bird-text2sql"
description = "Single-turn BIRD Text-to-SQL RLVR with verified grading and process rewards"
tags = ["text-to-sql", "bird", "sqlite", "rlvr", "train", "eval"]
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.0.0,<6.0.0",
    "lark>=1.2.0",
    "mo-sql-parsing==8.205.22260",
    "ordered-set>=4.1.0",
    "prettytable>=3.0.0",
    "pyyaml>=6.0.0",
    "sqlglot>=27.0.0",
    "ujson>=5.0.0",
    "verifiers>=0.3.0",
    "z3-solver>=4.13.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bird_text2sql"]

[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 1
